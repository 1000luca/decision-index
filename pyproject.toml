[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-index"
version = "0.3"
description = "Reproduction kit for the Decision Index benchmark: frozen suite, engines, scorers and index math."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.34,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.4",
  "transformers>=4.51,<6",
  "accelerate>=1.0",
  "safetensors>=0.4",
]
rebuild = [
  "pyarrow>=20",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "mido>=1.3",
  "python-chess>=1.10",
  "tiktoken>=0.7",
]
vision = [
  "pillow>=10",
  "pyarrow>=20",
  "numpy>=1.26",
]
dev = ["pytest>=8"]

[project.scripts]
decision-index = "decision_index.cli:main"

[tool.setuptools.packages.find]
include = ["decision_index*"]

[tool.setuptools.package-data]
decision_index = ["data/*.json", "data/*/*.json"]
